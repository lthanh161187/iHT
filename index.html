<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iHT — Learning Summary</title>
<style>
:root{
  --green:#177022; --yellow:#FFCA36; --ink:#171717; --muted:#697069;
  --paper:#f7f7f2; --white:#fff; --line:#dfe3dc; --max:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
a{text-decoration:none;color:inherit}.wrap{max-width:var(--max);margin:auto;padding:0 28px}
header{position:sticky;top:0;z-index:10;background:rgba(247,247,242,.94);
backdrop-filter:blur(12px);border-bottom:1px solid rgba(223,227,220,.8)}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;font-size:14px}
.brand{font-size:30px;font-weight:850;letter-spacing:.04em;color:var(--green)}.meta{color:var(--muted)}
.hero{padding:82px 0 100px}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--green);
font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:28px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
h1{max-width:920px;margin:0;font-size:clamp(50px,8vw,104px);line-height:.92;letter-spacing:-.065em}
.hero-bottom{margin-top:52px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end}
.intro{font-size:20px;max-width:640px}.date{text-align:right;color:var(--muted);font-size:14px}
section{border-top:1px solid var(--line);padding:72px 0}.section-head{display:grid;
grid-template-columns:180px 1fr;gap:32px;margin-bottom:46px}.number{font-size:13px;color:var(--green);font-weight:850;letter-spacing:.08em}
.section-title{margin:0;font-size:clamp(31px,4vw,54px);line-height:1;letter-spacing:-.045em}
.lead{font-size:18px;color:#424842;max-width:780px;margin:20px 0 0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.item{background:var(--white);
border:1px solid var(--line);padding:28px}.card{min-height:250px;display:flex;flex-direction:column;justify-content:space-between}
.card-num{font-size:30px;color:var(--green);font-weight:850;letter-spacing:.1em}
.card h3{font-size:27px;line-height:1.05;letter-spacing:-.025em;margin:55px 0 12px}.card p{color:#5c625d;margin:0}
.quote{background:var(--green);color:white;padding:56px clamp(28px,6vw,80px);position:relative;overflow:hidden}
.quote:after{content:"“";position:absolute;right:24px;top:-50px;font-size:220px;line-height:1;color:rgba(255,255,255,.08)}
.quote p{position:relative;z-index:1;max-width:880px;margin:0;font-size:clamp(32px,5vw,66px);line-height:1.02;letter-spacing:-.045em}
.experience{display:grid;grid-template-columns:1fr 1fr;gap:16px}.item strong{display:block;font-size:20px;margin-bottom:8px}
.questions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.question{border:1px solid var(--green);
padding:28px;min-height:190px}.question span{color:var(--green);font-weight:850;font-size:13px}
.question p{font-size:22px;line-height:1.15;margin-top:42px;letter-spacing:-.02em}
.practice{display:grid;grid-template-columns:1fr 1.3fr;gap:40px;align-items:center}
.practice-box{background:var(--yellow);padding:38px;font-size:25px;line-height:1.2;letter-spacing:-.025em}
.pager{display:flex;justify-content:space-between;align-items:center;padding:38px 0 70px;border-top:1px solid var(--line)}
.pager a{font-weight:850;color:var(--green)}.pager a.disabled{opacity:.25;pointer-events:none}
footer{border-top:1px solid var(--line);padding:30px 0 45px;color:var(--muted);font-size:13px}
@media(max-width:760px){
.wrap{padding:0 20px}.hero{padding:60px 0 70px}.hero-bottom,.section-head,.practice{grid-template-columns:1fr}
.date{text-align:left}.cards,.questions,.experience{grid-template-columns:1fr}section{padding:54px 0}
.section-head{gap:12px;margin-bottom:32px}.card{min-height:210px}.card h3{margin-top:35px}
}

.lesson-slides{display:flex;flex-direction:column;gap:18px}
.lesson-slide{background:var(--white);border:1px solid var(--line);padding:34px 36px;display:grid;grid-template-columns:120px 1fr;gap:30px}
.slide-label{color:var(--green);font-size:13px;font-weight:850;letter-spacing:.08em}
.slide-content h3{font-size:30px;line-height:1.05;letter-spacing:-.035em;margin:0 0 18px}
.slide-content p{margin:0 0 15px;color:#4f554f;font-size:16px;max-width:850px}
.slide-content p:last-child{margin-bottom:0}
@media(max-width:760px){.lesson-slide{grid-template-columns:1fr;gap:14px;padding:26px}.slide-content h3{font-size:25px}}


/* ===== Lesson carousel v3 ===== */
.lesson-carousel{position:relative;overflow:hidden;padding:0 2px 18px}
.lesson-track{
  display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;
  scroll-behavior:smooth;overscroll-behavior-x:contain;
  scrollbar-width:none;cursor:grab;padding:2px 1px 12px;
}
.lesson-track::-webkit-scrollbar{display:none}
.lesson-track.dragging{cursor:grabbing;scroll-behavior:auto}
.lesson-slide{
  flex:0 0 min(86%,900px);scroll-snap-align:center;
  background:var(--white);border:1px solid var(--line);padding:38px 40px;
  display:grid;grid-template-columns:120px 1fr;gap:30px;
  min-height:340px;transition:transform .25s ease,opacity .25s ease;
}
.slide-label{color:var(--green);font-size:13px;font-weight:850;letter-spacing:.08em}
.slide-content h3{font-size:clamp(27px,3vw,40px);line-height:1.04;letter-spacing:-.04em;margin:0 0 20px}
.slide-content p{margin:0 0 15px;color:#4f554f;font-size:16px;max-width:850px}
.slide-content p:last-child{margin-bottom:0}
.carousel-controls{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.carousel-buttons{display:flex;gap:8px}
.carousel-btn{
  width:42px;height:42px;border:1px solid var(--green);background:transparent;
  color:var(--green);font-size:19px;cursor:pointer;border-radius:50%;
}
.carousel-btn:hover{background:var(--green);color:#fff}
.carousel-btn:disabled{opacity:.25;cursor:default;background:transparent;color:var(--green)}
.carousel-status{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.carousel-dots{display:flex;gap:5px}
.carousel-dot{width:24px;height:3px;border:0;background:var(--line);cursor:pointer;padding:0}
.carousel-dot.active{background:var(--green)}
.swipe-hint{font-size:12px;color:var(--muted);margin-top:4px}
@media(max-width:760px){
  .lesson-slide{flex-basis:91%;grid-template-columns:1fr;gap:14px;padding:28px;min-height:420px}
  .slide-content h3{font-size:27px}.carousel-controls{margin-top:8px}
  .swipe-hint{display:block}
}
@media(min-width:761px){.swipe-hint{display:none}}

</style>
</head>

/* ===== Carousel interaction ===== */
const track = document.getElementById("lessonTrack");
const cards = [...document.querySelectorAll(".lesson-slide")];
const prev = document.getElementById("prevSlide");
const next = document.getElementById("nextSlide");
const counter = document.getElementById("carouselCounter");
const dots = document.getElementById("carouselDots");

let activeSlide = 0;
cards.forEach((_,i)=>{
  const dot=document.createElement("button");
  dot.className="carousel-dot"+(i===0?" active":"");
  dot.setAttribute("aria-label",`Đi tới thẻ ${i+1}`);
  dot.addEventListener("click",()=>goTo(i));
  dots.appendChild(dot);
});

function goTo(i){
  if(!cards.length)return;
  activeSlide=Math.max(0,Math.min(i,cards.length-1));
  cards[activeSlide].scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  updateControls();
}
function updateControls(){
  counter.textContent=`${String(activeSlide+1).padStart(2,"0")} / ${String(cards.length).padStart(2,"0")}`;
  prev.disabled=activeSlide===0;
  next.disabled=activeSlide===cards.length-1;
  [...dots.children].forEach((d,i)=>d.classList.toggle("active",i===activeSlide));
}
prev.addEventListener("click",()=>goTo(activeSlide-1));
next.addEventListener("click",()=>goTo(activeSlide+1));

let raf;
track.addEventListener("scroll",()=>{
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{
    const center=track.scrollLeft+track.clientWidth/2;
    let best=0,dist=Infinity;
    cards.forEach((card,i)=>{
      const c=card.offsetLeft+card.offsetWidth/2;
      const d=Math.abs(c-center);
      if(d<dist){dist=d;best=i}
    });
    if(best!==activeSlide){activeSlide=best;updateControls()}
  });
});

let isDown=false,startX=0,startScroll=0;
track.addEventListener("pointerdown",e=>{
  isDown=true;startX=e.clientX;startScroll=track.scrollLeft;
  track.classList.add("dragging");track.setPointerCapture?.(e.pointerId);
});
track.addEventListener("pointermove",e=>{
  if(!isDown)return;
  track.scrollLeft=startScroll-(e.clientX-startX);
});
track.addEventListener("pointerup",()=>{isDown=false;track.classList.remove("dragging")});
track.addEventListener("pointercancel",()=>{isDown=false;track.classList.remove("dragging")});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")goTo(activeSlide-1);
  if(e.key==="ArrowRight")goTo(activeSlide+1);
});
updateControls();
</script>
